# ==============================================================================
# BlackBox Sentinel — Hardened Kernel & Network Security Configuration (sysctl)
# Target Host: Raspberry Pi Zero 2 W (Debian 12 Bookworm / Linux 6.x)
# ==============================================================================

# ── 1. Network Bridge & Forwarding ───────────────────────────────────────────
# Enable IP packet forwarding across transparent inline network bridge
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 0

# Bridge filtering settings (pass bridge traffic through iptables / eBPF)
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 1

# ── 2. TCP/IP Stack Hardening ────────────────────────────────────────────────
# Enable TCP SYN Cookies against SYN Flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3

# Disable ICMP Redirects (prevent routing manipulation by adversary)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable Source Routing (prevent attacker-directed IP routing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Enable Strict Reverse Path Filtering (Spoofing Protection)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log Martians (Packets with impossible addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP Echo Broadcasts (Smurf attack prevention)
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ── 3. Kernel Memory & Tamper Protection ─────────────────────────────────────
# Hide kernel pointers to prevent memory exploit development
kernel.kptr_restrict = 2

# Restrict dmesg buffer access to root only
kernel.dmesg_restrict = 1

# Restrict eBPF (bpf syscall) to CAP_SYS_ADMIN
kernel.unprivileged_bpf_disabled = 1

# Prevent ptrace scope tampering from untrusted processes
kernel.yama.ptrace_scope = 2

# Reboot automatically after kernel panic (10s delay)
kernel.panic = 10
kernel.panic_on_oops = 1

# Memory overcommit protection for tight 512MB RAM on Pi Zero 2 W
vm.overcommit_memory = 2
vm.overcommit_ratio = 80
vm.swappiness = 10
vm.panic_on_oom = 0
